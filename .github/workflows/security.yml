name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: uv audit · known vulnerabilities in uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Audit every workspace member (all extras, all groups)
        run: uv audit --preview-features audit-command --frozen

  secrets:
    name: gitleaks · no key material in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan full git history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --no-banner --redact --exit-code 1 --config /repo/.gitleaks.toml

  sast:
    name: semgrep · Python security rules
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@v5

      - name: Scan sources (blocking on findings)
        run: |
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --metrics=off --error
