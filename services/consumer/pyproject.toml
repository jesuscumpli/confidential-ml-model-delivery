[project]
name = "consumer"
version = "0.1.0"
description = "Retrieves, verifies and decrypts HF model artifacts (Layer 1/2 consumer)"
readme = "README.md"
authors = [
    { name = "jesuscumpli" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0.0",
    "huggingface_hub>=0.30.0",
    "transformers>=4.48.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]