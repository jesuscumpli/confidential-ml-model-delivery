[project]
name = "producer"
version = "0.1.0"
description = "Encrypts and publishes HF model artifacts (Layer 1/2 producer)"
readme = "README.md"
authors = [
    { name = "jesuscumpli" }
]
requires-python = ">=3.12"
dependencies = [
    "confidential-crypto",
    "cryptography>=44.0.0",
    "huggingface_hub>=0.30.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
producer = "producer.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
confidential-crypto = { path = "../../packages/confidential-crypto", editable = true }

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network access or a real Hugging Face repository"]
addopts = "-m 'not slow'"
